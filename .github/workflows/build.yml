name: Build WhatsApp Notifier

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Windows
            runner: windows-latest
            artifact_name: WhatsAppNotifier-windows

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve version from tag
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -match '^refs/tags/v(.+)$') {
            $ver = $matches[1]
          } else {
            $ver = "1.0.0"
          }
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Resolved version: $ver"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js (for bridge npm install)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install bridge dependencies
        run: |
          cd bridge
          npm install --production

      - name: Build with PyInstaller
        run: |
          pyinstaller whatsapp-notifier.spec --noconfirm --clean

      - name: Download portable Node.js runtime
        shell: pwsh
        run: |
          $nodeVersion = "v22.11.0"
          $url = "https://nodejs.org/dist/$nodeVersion/node-$nodeVersion-win-x64.zip"
          $zip = "$env:TEMP\node-portable.zip"
          $extractDir = "$env:TEMP\node-portable"
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          Expand-Archive -Path $zip -DestinationPath $extractDir -Force
          # The archive contains a folder like node-v22.11.0-win-x64/
          $src = Get-ChildItem -Directory $extractDir | Select-Object -First 1
          $dest = "dist\WhatsAppNotifier\node"
          New-Item -ItemType Directory -Force -Path $dest
          Copy-Item -Recurse -Force "$($src.FullName)\*" $dest
          Write-Host "Bundled Node.js at $dest"
          & "$dest\node.exe" --version

      - name: Assemble distribution folder
        shell: pwsh
        run: |
          $distDir = "dist\WhatsAppNotifier"
          # Ensure bridge node_modules are included (PyInstaller datas may
          # not pick them up because they are not imported by Python)
          if (Test-Path "bridge\node_modules") {
            New-Item -ItemType Directory -Force -Path "$distDir\bridge"
            Copy-Item -Recurse -Force "bridge\node_modules" "$distDir\bridge\"
            Copy-Item -Force "bridge\package.json" "$distDir\bridge\"
            Copy-Item -Force "bridge\whatsapp-bridge.js" "$distDir\bridge\"
          }

          # Create README
          @"
          WhatsApp Notifier - Distribution Package
          ========================================

          This package is installed by WhatsAppNotifier-Setup-x.y.z.exe.
          It bundles its own Node.js runtime, so no external dependencies
          are required.

          Per-user data (settings, WhatsApp auth state, history) is stored
          under: %APPDATA%\whatsapp-notifier\

          To run manually (without the installer):
          1. Keep this folder structure intact.
          2. Run WhatsAppNotifier.exe
          3. The app will start the WhatsApp bridge automatically using
             the bundled node\node.exe.
          "@ | Out-File -Encoding utf8 "$distDir\README.txt"

      - name: Set up Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler not found at $iscc"
          }
          Write-Host "Inno Setup installed at $iscc"

      - name: Build installer
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          $ver = $env:VERSION
          Write-Host "Building installer for version $ver"
          & $iscc /DVERSION=$ver installer\whatsapp-notifier.iss
          $installerPath = "installer\Output\WhatsAppNotifier-Setup-$ver.exe"
          if (-not (Test-Path $installerPath)) {
            throw "Installer not found at $installerPath"
          }
          Write-Host "Installer built: $installerPath"
          # Copy to workspace root for upload
          Copy-Item $installerPath "$env:GITHUB_WORKSPACE\WhatsAppNotifier-Setup-$ver.exe"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: WhatsAppNotifier-Setup-*.exe
          retention-days: 30

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*.exe
